  <main class="page">
    <div class="wrap page-hero">
      <div class="breadcrumbs"><a href="../index.html">Bosh sahifa</a> / Lug‘at</div>
      <h1>Kosmik <span>lug‘at</span></h1>
      <p class="lead">Darsda uchraydigan asosiy so‘zlar. Qisqa izoh — eslab qolish oson bo‘lsin.</p>
      <div class="searchbar"><input data-gloss-search type="search" placeholder="Atamani yozing…" /></div>
    </div>
    <section>
      <div class="wrap" id="gloss"></div>
    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/prefs.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const box = document.getElementById("gloss");
    function draw(q){
      q = (q||"").toLowerCase();
      box.innerHTML = YA_DATA.glossary.filter(([k,v]) => !q || (k+" "+v).toLowerCase().indexOf(q)>-1).map(([k,v]) => `
      <article class="card" style="margin-bottom:12px"><h3>${k}</h3><p>${v}</p></article>`).join("") || '<div class="card">Topilmadi.</div>';
    }
    draw("");
    const inp = document.querySelector("[data-gloss-search]");
    if (inp) inp.addEventListener("input", () => draw(inp.value));
  </script>
</body>
